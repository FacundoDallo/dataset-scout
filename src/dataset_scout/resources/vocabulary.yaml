# Words that mark a genotype or treatment value as the control group.
control_genotype_terms: [wild type, wild-type, wildtype, wt, control, ctrl, non-transgenic, nontransgenic, ntg, littermate control, wt littermate, "+/+", normal]
# Treatment values are compared whole, without accents; "None/naïve" is read as two control words.
control_treatment_terms: [vehicle, pbs, saline, control, ctrl, ctr, con, untreated, not treated, non treated, nontreated, none, no treatment, sham, mock, dmso, naive, water, unstimulated, baseline]

# Words that describe how a sample was obtained.
isolation_terms: [sorted, facs, macs, flow cytometry, magnetic beads, magnetic-activated, isolated, purified, percoll, immunopanning, cd11b, cd11b+, cx3cr1, tmem119, p2ry12, cd45lo, cd45int]
ipsc_terms: [ipsc, ipscs, hipsc, induced pluripotent, imgl, imgls, ipsc-derived, ipsc derived, esc-derived]
organoid_terms: [organoid, organoids, assembloid, assembloids, spheroid]
culture_terms: [primary culture, cultured, in vitro, culture, cell culture]
pooled_terms: [pooled, pool, pools, pool of]
single_cell_terms: [single cell, single-cell, scrna-seq, scrnaseq, scrna, snrna-seq, snrnaseq, snrna, single nucleus, single-nucleus, single nuclei, 10x genomics, 10x chromium, drop-seq, dropseq, smart-seq2, smart-seq, cite-seq, split-seq, sci-rna-seq, transcriptomic single cell]
# Per-cell quality-control field names. Plate-based studies list every cell as a sample and report these,
# even when their library source only says "transcriptomic". Compared with the whole field name.
single_cell_qc_keys: [ngene, ngenes, n genes, numi, numis, n umi, percentmito, percent mito, percent.mito, percent.mt, ncount rna, nfeature rna]
