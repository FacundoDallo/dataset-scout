# Controlled vocabulary used by the harmonizer.
#
# Each entry maps a canonical term to the spellings found in public metadata.
# Matching is case-insensitive and whole-word; longer synonyms win, so
# "prefrontal cortex" is matched before "cortex".
#
# Ambiguous abbreviations are left out on purpose ("HPC" is hippocampus in one
# study and hematopoietic progenitor cells in another). A missed term shows up
# in the curator inbox; a wrong match would be silent.
#
# Ontology identifiers (UBERON for anatomy, CL for cell types) make the output
# interoperable with other resources. They were entered by hand and should be
# checked against the EBI Ontology Lookup Service before relying on them.
# To extend the vocabulary for another question, copy this file, edit it and
# point `paths.vocabulary` in the run configuration to the copy.

tissue:
  brain:
    # "olfactory bulb-removed brains" is a whole brain, not an olfactory bulb.
    synonyms: [whole brain, brain tissue, brains, forebrain, brain hemisphere, hemibrain, olfactory bulb-removed brains]
    ontology: UBERON:0000955
  hippocampus:
    # "hippocamus" is a misspelling found in GEO records.
    synonyms: [hippocampal, hippocampal formation, hippocampi, dentate gyrus, ca1, ca3, hippocamus]
    ontology: UBERON:0002421
  cerebral cortex:
    synonyms: [cortex, cortical, neocortex, frontal cortex, somatosensory cortex, motor cortex, visual cortex, entorhinal cortex]
    ontology: UBERON:0000956
  prefrontal cortex:
    synonyms: [pfc, medial prefrontal cortex, mpfc]
    ontology: UBERON:0000451
  cerebellum:
    synonyms: [cerebellar]
    ontology: UBERON:0002037
  striatum:
    synonyms: [striatal, caudate putamen, nucleus accumbens]
    ontology: UBERON:0002435
  hypothalamus:
    synonyms: [hypothalamic]
    ontology: UBERON:0001898
  brainstem:
    synonyms: [brain stem]
    ontology: UBERON:0002298
  thalamus:
    synonyms: []
    ontology: UBERON:0001897
  midbrain:
    synonyms: []
    ontology: UBERON:0001891
  substantia nigra:
    synonyms: []
    ontology: UBERON:0002038
  olfactory bulb:
    synonyms: [olfactory bulbs]
    ontology: UBERON:0002264
  choroid plexus:
    synonyms: []
    ontology: UBERON:0001886
  # SVZ is unambiguous in neuroscience records. Its UBERON identifier still has to be looked up.
  subventricular zone:
    synonyms: [svz]
  white matter:
    synonyms: []
    ontology: UBERON:0002316
  grey matter:
    synonyms: [gray matter]
    ontology: UBERON:0002020
  optic nerve:
    synonyms: []
    ontology: UBERON:0000941
  spinal cord:
    # Keeps "spinal cord white matter" in the spinal cord instead of generic white matter.
    synonyms: [spinal, lumbar spinal cord, cervical spinal cord, spinal cord white matter]
    ontology: UBERON:0002240
  retina:
    synonyms: [retinal, retinas]
    ontology: UBERON:0000966
  blood:
    synonyms: [peripheral blood, whole blood, pbmc, pbmcs]
    ontology: UBERON:0000178
  bone marrow:
    synonyms: [marrow]
    ontology: UBERON:0002371
  spleen:
    synonyms: [splenic]
    ontology: UBERON:0002106
  liver:
    synonyms: [hepatic]
    ontology: UBERON:0002107
  lung:
    synonyms: [lungs, pulmonary]
    ontology: UBERON:0002048
  heart:
    synonyms: [cardiac, myocardium]
    ontology: UBERON:0000948
  kidney:
    synonyms: [renal, kidneys, renal cortex, kidney cortex]
    ontology: UBERON:0002113
  adipose tissue:
    synonyms: [fat, white adipose tissue, wat, brown adipose tissue, adipose]
    ontology: UBERON:0001013
  skeletal muscle:
    synonyms: [muscle, gastrocnemius, quadriceps, tibialis anterior]
    ontology: UBERON:0001134
  skin:
    synonyms: [dermis, epidermis]
    ontology: UBERON:0002097

