# Continuous integration: every push and pull request is checked automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit and end-to-end tests
        run: pytest
      - name: Replay the recorded demo run (offline)
        if: hashFiles('snapshots/microglia-aging/snapshot_index.csv') != ''
        run: scout run config/microglia_aging.yaml --mode replay --output-dir ci-outputs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t dataset-scout .
      - name: Smoke test
        run: docker run --rm dataset-scout --version
